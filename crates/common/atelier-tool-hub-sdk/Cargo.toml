[package]
license = "Apache-2.0"
name = "atelier-tool-hub-sdk"
version = "0.1.0"
edition.workspace = true
description = "SDK for the Atelier Tool Hub: connection pool, transparent reconnect, tool harness, and tool-server runtime."

[features]
metrics = []

[dependencies]
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
tokio-util = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
dashmap = { workspace = true }
indexmap = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
http = { workspace = true }
parking_lot = { workspace = true }
fastrace = { workspace = true }

atelier-tool-protocol = { workspace = true }
atelier-tool-runtime = { workspace = true }
atelier-tool-types = { workspace = true }
atelier-tool-hub-core = { workspace = true }

# Integration tests that need heavier backend deps live in a separate sibling crate to keep this dev-dep set minimal.
[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
axum = { workspace = true, features = ["ws", "macros"] }
schemars = { workspace = true }

[lints]
workspace = true
