[package]
license = "Apache-2.0"
name = "atelier-http"
version = "0.1.0"
edition.workspace = true
description = "Shared reqwest HTTP clients and User-Agent construction for the atelier CLI."

[dependencies]
reqwest = { workspace = true, features = ["blocking"] }
reqwest-middleware = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
atelier-auth = { workspace = true, features = ["middleware"] }
atelier-sampler = { path = "../atelier-sampler" }
atelier-telemetry = { workspace = true }
atelier-version = { workspace = true }
atelier-workspace = { workspace = true }

[lints]
workspace = true
