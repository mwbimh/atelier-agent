[package]
license = "Apache-2.0"
name = "atelier-config"
version = "0.1.0"
edition.workspace = true
description = "Shared config loading for Atelier — atelier_home, effective config (requirements > user > managed), TOML merge"

[dependencies]
base64 = { workspace = true }
blake3 = { workspace = true }
dunce = { workspace = true }
ring = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shellexpand = "3.1"
thiserror = { workspace = true }
toml = { workspace = true }
which = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true }
atelier-provider = { path = "../atelier-provider" }
atelier-tty-utils = { workspace = true }
atelier-version = { workspace = true }

# core-foundation: read macOS MDM managed preferences (`ai.x.atelier`) for the
# admin-deployed requirements layer.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serial_test = { workspace = true }

[features]

[lints]
workspace = true
