[package]
license = "Apache-2.0"
name = "atelier-telemetry"
version = "0.1.0"
edition.workspace = true
description = "Local observability and event compatibility layer for Atelier"

[features]
default = []
default-bazel = []
memory-log = []

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true }
tracing-appender = "0.2.4"
tracing-chrome = "0.7.2"
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "fmt",
    "json",
    "time",
] }
chrono = { workspace = true }
git2 = { version = "0.20", default-features = false, features = [
    "vendored-libgit2",
] }
atelier-secrets = { workspace = true }
atelier-token-estimation = { workspace = true }
uuid = { workspace = true, features = ["v5", "v7"] }
mid = "4.0.0"
tokio = { workspace = true, features = ["macros", "sync", "rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
# Sets a symlink's own mtime (std's `set_modified` follows links) for prune tests.
filetime = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
