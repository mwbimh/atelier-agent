[package]
license = "Apache-2.0"
name = "atelier-config-types"
version = "0.1.0"
edition.workspace = true
description = "Leaf configuration value types for the atelier CLI, extracted from atelier-shell for dependency inversion."

[dependencies]
agent-client-protocol = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true }
atelier-announcements = { workspace = true }
atelier-config = { workspace = true }
atelier-mcp = { workspace = true }

[features]
default-bazel = []

[lints]
workspace = true
